[project]
name = "empulse-mcp"
version = "1.0.0"
description = "stdio bridge to the EMpulse Street FX Index MCP server (street exchange rates of emerging-market currencies)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "EMpulse", email = "hello@empulse.ai" }]
keywords = ["mcp", "model-context-protocol", "exchange-rates", "emerging-markets", "fx", "street-rate"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Topic :: Office/Business :: Financial",
]
dependencies = []

[project.urls]
Homepage = "https://empulse.ai"
Documentation = "https://empulse.ai/llms.txt"
Repository = "https://github.com/empulse-ai/empulse-mcp"

[project.scripts]
empulse-mcp = "empulse_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["empulse_mcp"]
